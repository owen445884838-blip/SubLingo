<script>
        function showSavePopup(element, word, ipa, def) {
            // Visual feedback on tapped word
            document.querySelectorAll('.tappable-word').forEach(el => el.classList.remove('bg-primary/30', 'rounded'));
            element.classList.add('bg-primary/30', 'rounded');

            // Update popup content
            document.getElementById('popupWord').innerText = word;
            document.getElementById('popupIpa').innerText = ipa;
            document.getElementById('popupDef').innerText = def;

            // Show popup
            const popup = document.getElementById('saveWordPopup');
            const card = document.getElementById('saveWordCard');
            popup.classList.remove('opacity-0', 'pointer-events-none');
            card.classList.remove('translate-y-4');
        }

        function hideSavePopup() {
            // Remove highlight
            document.querySelectorAll('.tappable-word').forEach(el => el.classList.remove('bg-primary/30', 'rounded'));
            
            // Hide popup
            const popup = document.getElementById('saveWordPopup');
            const card = document.getElementById('saveWordCard');
            popup.classList.add('opacity-0', 'pointer-events-none');
            card.classList.add('translate-y-4');
        }
    </script>
