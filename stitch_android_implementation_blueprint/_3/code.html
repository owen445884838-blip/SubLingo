<script>
        // Simple Interaction Logic for demo purposes
        document.addEventListener('DOMContentLoaded', () => {
            const card = document.getElementById('card-1');
            const flipBtns = document.querySelectorAll('.flip-btn, #btnFlipMain');
            let isFlipped = false;

            flipBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation(); // Prevent swipe interference
                    isFlipped = !isFlipped;
                    if(isFlipped) {
                        card.classList.add('is-flipped');
                    } else {
                        card.classList.remove('is-flipped');
                    }
                });
            });

            // Action buttons on the back of the card
            const btnForgot = document.getElementById('btnForgot');
            const btnKnown = document.getElementById('btnKnown');

            const swipeOut = (direction) => {
                // Simulate swipe out animation
                const translateX = direction === 'left' ? '-150%' : '150%';
                const rotate = direction === 'left' ? '-20deg' : '20deg';
                
                card.style.transition = 'transform 0.4s ease-out, opacity 0.4s ease-out';
                card.style.transform = `translateX(${translateX}) rotate(${rotate}) ${isFlipped ? 'rotateY(180deg)' : ''}`;
                card.style.opacity = '0';

                // Reset after animation
                setTimeout(() => {
                    card.style.transition = 'none';
                    card.style.transform = '';
                    card.style.opacity = '1';
                    card.classList.remove('is-flipped');
                    isFlipped = false;
                    
                    // In a real app, we'd cycle the DOM elements here
                    // This is just a visual reset for the prototype
                }, 400);
            };

            btnForgot.addEventListener('click', () => swipeOut('left'));
            btnKnown.addEventListener('click', () => swipeOut('right'));
        });
    </script>
